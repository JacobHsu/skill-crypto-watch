# ---------- Group 2 · momentum

[[node]]
id = "hma"
section = "B"
name = "HULL MA (HMA)"
zh = "赫爾均線"
group = "ma"
type = "score"
rule = "hma"
weight = 1.0
params = { slope_bars = 2 }

[[node]]
id = "rsi"
section = "B"
name = "RSI"
zh = "相對強弱指標"
group = "momentum"
type = "score"
rule = "rsi"
weight = 1.0
# overbought_score / oversold_score apply when RSI is extreme but there is no new high/low
# to test for divergence; symbol files override them from backtest results.
params = { overbought = 70, oversold = 30, neutral_band = [45, 55], divergence_lookback = 20, overbought_score = 0, oversold_score = 0 }

[[node]]
id = "stoch_rsi"
section = "B"
name = "STOCHASTIC RSI"
zh = "隨機相對強弱"
group = "momentum"
type = "score"
rule = "stoch_rsi"
weight = 1.0
params = { lookback = 2, low = 20, high = 80 }

[[node]]
