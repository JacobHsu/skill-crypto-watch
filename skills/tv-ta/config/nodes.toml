section = "B"
name = "ULTIMATE OSCILLATOR"
zh = "終極震盪指標"
group = "momentum"
type = "score"
rule = "uo"
weight = 1.0
# Not in CHECK.md yet: first-draft rule. Extremes read as mean reversion.
params = { overbought = 70, oversold = 30, overbought_score = -1, oversold_score = 1 }

