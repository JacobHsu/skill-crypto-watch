# tv-ta decision nodes
#
# One [[node]] per checklist item, in the order of crypto-watch check.html.
# Fields:
#   id        stable key (logs, symbol overrides and Jev answers use it)
#   section   A = {symbol}.html (19 items), B = o/{symbol}.html (17 items), gate = not a vote
#   name/zh   display names, matching check.html
#   group     trend | channel | ma | momentum | volatility | volume | structure
#             gates scale weights by group (see profile.toml [[gate]])
#   type      score (-2..+2) | choice (category mapped to a score) | noul (0..1 gate)
#   rule      rule function in scripts/nodes.py
#   weight    vote weight in the composite score; 0 disables the vote but still shows the row
#   enabled   false = not evaluated at all (kept for check.html parity)
#   params    thresholds the rule reads; tune these instead of editing code
#   jev       optional TypeSafe Jev question; used only when profile.toml [jev] enabled = true
#             and TYPESAFE_API_KEY is set. See references/node_design.md.
#
# Per-symbol changes go in config/symbols/<sym>.toml, not here.

# ============================================================ SECTION A · {symbol}.html
# ---------- COL 1 — TREND

[[node]]
id = "mtp"
section = "A"
name = "MULTI-TIME PERIOD"
zh = "多時間框架"
group = "trend"
type = "score"
rule = "mtp"
weight = 1.0
# Counts green vs red higher-timeframe candles, as the chart's colour blocks show them.
# Higher timeframe per chart timeframe: profile.toml [timeframes.htf]
params = { count = 11, majority = 0.6 }

[[node]]
id = "fractals"
section = "A"
name = "WILLIAMS FRACTALS"
zh = "威廉碎形"
group = "structure"
type = "choice"
rule = "fractals"
weight = 1.0
params = {}

[[node]]
id = "alligator"
section = "A"
name = "WILLIAMS ALLIGATOR"
zh = "威廉鱷魚"
group = "trend"
type = "choice"
rule = "alligator"
weight = 1.0
# below min_spread_atr (lines spread / ATR) the alligator counts as sleeping
params = { min_spread_atr = 0.3 }

[[node]]
id = "alligator_x_fractal"
section = "A"
name = "↳ ALLIGATOR × FRACTAL"
zh = "鱷魚確認碎形"
group = "trend"
type = "score"
rule = "alligator_x_fractal"
weight = 1.0
params = {}

[[node]]
id = "psar"
section = "A"
name = "PARABOLIC SAR"
zh = "拋物線停損"
group = "trend"
type = "score"
rule = "psar"
weight = 1.0
params = { fresh_bars = 3 }

# ---------- COL 2 — CHANNEL

[[node]]
id = "bb"
section = "A"
name = "BOLLINGER BANDS"
zh = "布林通道"
group = "channel"
type = "score"
rule = "bollinger"
weight = 1.0
params = { width_lookback = 3 }

[[node]]
id = "kc"
section = "A"
name = "KELTNER CHANNEL"
zh = "肯特納通道"
group = "channel"
type = "score"
rule = "keltner"
weight = 1.0
# "站穩" = this many consecutive closes outside the band
params = { hold_bars = 2 }

[[node]]
id = "squeeze"
section = "A"
name = "BB / KC SQUEEZE"
zh = "布林 × 肯特納擠壓"
group = "volatility"
type = "choice"
rule = "squeeze"
weight = 1.0
params = {}

[[node]]
id = "ma_cross"
section = "A"
name = "MA CROSS"
zh = "均線交叉"
group = "ma"
type = "score"
rule = "ma_cross"
weight = 1.0
# a cross within the last `lookback` bars counts as a signal
params = { lookback = 3 }

[[node]]
id = "vol_stop"
section = "A"
name = "VOLATILITY STOP"
zh = "波動停損"
group = "trend"
type = "score"
rule = "vol_stop"
weight = 1.0
params = {}

# ---------- COL 3 — MOVING AVERAGE

[[node]]
id = "ma_20_50"
section = "A"
name = "MA 20 / 50"
zh = "簡單移動平均線"
group = "ma"
type = "choice"
rule = "ma_align"
weight = 1.0
params = { kind = "sma" }

[[node]]
id = "ema_20_50"
section = "A"
name = "EMA 20 / 50"
zh = "指數移動平均線"
group = "ma"
type = "choice"
rule = "ma_align"
weight = 1.0
params = { kind = "ema" }

[[node]]
id = "donchian"
section = "A"
name = "DONCHIAN CHANNELS"
zh = "唐奇安通道"
group = "channel"
type = "score"
rule = "donchian"
weight = 1.0
params = {}

[[node]]
id = "ma_x_ema"
section = "A"
name = "↳ MA × EMA 共振"
zh = "均線共振"
group = "ma"
type = "score"
rule = "agree"
weight = 1.0
params = { a = "ma_20_50", b = "ema_20_50", score = 1 }

# ---------- COL 4 — TREND / EXIT

[[node]]
id = "zigzag"
section = "A"
name = "ZIG ZAG"
zh = "折線指標"
group = "structure"
type = "choice"
rule = "zigzag"
weight = 1.0
params = {}
# Example of a Jev node (inactive until profile.toml [jev] enabled = true):
# jev = { instructions = "Given the swing pivots in `zigzag`, how clearly do they form a trending structure?", criteria = ["Clear lower highs and lower lows", "Mostly descending", "No clear order", "Mostly ascending", "Clear higher highs and higher lows"] }

[[node]]
id = "supertrend"
section = "A"
name = "SUPERTREND"
zh = "超級趨勢線"
group = "trend"
type = "score"
rule = "supertrend"
weight = 1.0
params = {}

[[node]]
id = "linreg"
section = "A"
name = "LINEAR REGRESSION"
zh = "線性迴歸"
group = "trend"
type = "score"
rule = "linreg"
weight = 1.0
# flat_pct: total slope across the window below this % counts as flat
# near_dev: |close - line| below this many residual stdevs counts as "near the line"
params = { flat_pct = 2.0, near_dev = 0.5 }

[[node]]
id = "sar_x_linreg"
section = "A"
name = "↳ SAR × LINEAR REG"
zh = "SAR 與迴歸線雙確認"
group = "trend"
type = "score"
rule = "sar_x_linreg"
weight = 1.0
params = {}

[[node]]
id = "vwma"
section = "A"
name = "VWMA"
zh = "量加權移動平均線"
group = "volume"
type = "score"
rule = "vwma"
weight = 1.0
params = { slope_bars = 3, near_atr = 0.25 }

